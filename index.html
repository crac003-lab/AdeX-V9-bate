<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Spanish Lab · 后厨西语 × 厨房科学实验室</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='22' r='9' fill='%23FFC846'/%3E%3Ccircle cx='28.5' cy='21' r='1.4' fill='%233B3026'/%3E%3Ccircle cx='35.5' cy='21' r='1.4' fill='%233B3026'/%3E%3Cpath d='M30 23.5 L32 25.6 L34 23.5 Z' fill='%23F2743C'/%3E%3Cpath d='M15 31 L19.5 27 L24 31.5 L28.5 27 L32 31 L35.5 27 L40 31.5 L44.5 27 L49 31 C49 45 42 55 32 55 C22 55 15 45 15 31 Z' fill='%23FFFFFF' stroke='%23E4CFA9' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DM+Serif+Display&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{
 --bg:#FBF6EE;--bg-2:#F4ECE0;--card:#FFFFFF;--card-2:#FAF5EC;--card-3:#F6F0E5;
 --ink:#3B3026;--ink-soft:#7C6F5D;--ink-faint:#B2A694;--line:#EDE5D7;--line-2:#E2D8C7;
 --red:#EF4D44;--red-d:#D9382F;--green:#22B566;--green-d:#179552;--blue:#3D7DE8;--blue-l:#6AA6FF;
 --orange:#FF8A3D;--gold:#F6B01D;--purple:#8B5CF6;
 --tomato:#DF6A58;--olive:#4F8768;--saffron:#D09A4E;--berry:#B46A5F;--ice:#7AA094;--grape:#9D7E92;--sage:#79A08B;--apricot:#DEA568;
 --r-lg:22px;--r-md:15px;--r-sm:11px;
 --shadow:0 4px 12px rgba(120,90,50,.07),0 18px 40px -24px rgba(120,90,50,.28);
 --shadow-sm:0 2px 8px rgba(120,90,50,.07);--shadow-pop:0 12px 32px -12px rgba(120,90,50,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:"DM Serif Display","Noto Serif SC","Songti SC",serif;font-weight:400;}
::selection{background:rgba(255,160,90,.28);}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
a{color:var(--blue);text-decoration:none;}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 18px 90px;}

/* Header */
.topbar{position:sticky;top:0;z-index:50;background:rgba(251,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:1000px;margin:0 auto;padding:10px 16px 0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{width:38px;height:38px;flex:none;}
.brand b{font-family:"DM Serif Display",serif;font-size:19px;line-height:1.1;display:block;}
.brand small{color:var(--ink-soft);font-size:11.5px;letter-spacing:.3px;}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin-top:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav button{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-soft);background:transparent;white-space:nowrap;transition:.2s;}
.nav button.active{background:var(--ink);color:#fff;}
.nav button:not(.active):active{background:var(--bg-2);}

/* Views */
.view{display:none;animation:fade .4s ease both;padding-top:22px;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.beta{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#eef7f0,#f4f9f2);border:1px solid #d8ecdc;color:#3f7a52;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;margin-bottom:18px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px;}
.sec-title h2{font-size:25px;margin:0;}
.sec-title .tagline{color:var(--ink-soft);font-size:13.5px;}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--saffron);}

/* Hero */
.hero{background:linear-gradient(160deg,#fff,#fdf3e3);border:1px solid var(--line);border-radius:26px;padding:26px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:18px;}
.hero h1{font-size:34px;line-height:1.15;margin:6px 0 8px;}
.hero p{color:var(--ink-soft);margin:0 0 16px;max-width:60ch;}
.hero .egg{position:absolute;right:-20px;bottom:-30px;width:170px;opacity:.5;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:999px;font-weight:800;font-size:14.5px;background:var(--bg-2);color:var(--ink);border:1px solid var(--line-2);transition:.18s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.ghost{background:#fff;}
.btn.small{padding:7px 13px;font-size:13px;}

/* Stat grid */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 12px;text-align:center;box-shadow:var(--shadow-sm);}
.stat .num{font-family:"DM Serif Display",serif;font-size:26px;line-height:1;}
.stat .lab{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr);}}

/* Module quick grid */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:680px){.qgrid{grid-template-columns:repeat(2,1fr);}}
.qcell{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:15px;box-shadow:var(--shadow-sm);text-align:left;transition:.18s;}
.qcell:active{transform:scale(.98);}
.qcell .emo{font-size:20px;}
.qcell b{display:block;font-size:14.5px;margin:6px 0 2px;}
.qcell span{font-size:12px;color:var(--ink-soft);}

/* Quiz */
.modhead{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;flex-wrap:wrap;}
.modhead h3{font-size:20px;margin:0;}
.pill{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--line-2);}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.qcard .qno{font-size:11.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.5px;}
.qcard .qstem{font-weight:700;margin:5px 0 11px;font-size:15.5px;}
.opts{display:grid;gap:8px;}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card-2);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;font-size:14.5px;width:100%;transition:.15s;line-height:1.5;}
.opt .letter{flex:none;width:23px;height:23px;border-radius:50%;background:#fff;border:1.5px solid var(--line-2);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.opt:active{transform:scale(.99);}
.opt.correct{background:#e9f8ef;border-color:var(--green);color:var(--green-d);font-weight:700;}
.opt.correct .letter{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{background:#fdeceb;border-color:var(--red);color:var(--red-d);font-weight:700;}
.opt.wrong .letter{background:var(--red);color:#fff;border-color:var(--red);}
.opt.dim{opacity:.55;}
.explain{margin-top:11px;background:var(--card-3);border-left:3px solid var(--saffron);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 13px;font-size:13.5px;display:none;}
.explain.show{display:block;}
.explain b{color:var(--saffron);}
.audiobtn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
.audiobtn.sm{width:28px;height:28px;}
.qstem-row{display:flex;align-items:center;gap:10px;}
.qstem-row .qstem{flex:1;}

/* Listening */
.lpack{background:linear-gradient(160deg,#fff,#f1f6f5);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;}
.lpack h3{margin:0 0 4px;font-size:19px;}
.lpack .lsub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
.lbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.lscript{background:#fff;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:13px;font-size:14.5px;display:none;}
.lscript.show{display:block;}
.lscript .zh{display:block;color:var(--ink-soft);font-size:13px;margin-top:8px;}
.kw-mark{background:#fff2cf;border-radius:4px;padding:0 3px;}
.kw-neg{background:#fde0de;border-radius:4px;padding:0 3px;color:var(--red-d);}
.kw-time{background:#e2ecfb;border-radius:4px;padding:0 3px;color:var(--blue);}

/* Dialogues */
.dlcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.dlhead{padding:16px 18px;background:linear-gradient(160deg,#fff,#fdf0e6);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.dlhead .meta{flex:1;}
.dlhead h3{margin:0;font-size:19px;}
.dlhead .sub{font-size:12.5px;color:var(--ink-soft);}
.turn{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;gap:11px;}
.turn:last-child{border-bottom:0;}
.turn .sp{flex:none;width:54px;font-weight:800;font-size:12.5px;color:var(--saffron);padding-top:2px;}
.turn .es{font-size:15px;}
.turn .zh{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px;}
.dlfocus{padding:9px 18px;background:var(--card-2);font-size:12.5px;color:var(--ink-soft);}
.dlfocus b{color:var(--olive);}

/* Slang */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1.5px solid var(--line-2);color:var(--ink-soft);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.slangcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.slangcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.slangcard .expr{font-weight:800;font-size:16px;flex:1;}
.flag{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink-soft);}
.catA{color:var(--olive);}.catB{color:var(--saffron);}.catC{color:var(--berry);}.catD{color:var(--ice);}
.slangcard .mean{margin:7px 0 4px;font-size:14px;}
.slangcard .ex{font-size:13.5px;color:var(--ink-soft);font-style:italic;}
.slangcard .reg{font-size:11.5px;color:var(--berry);margin-top:4px;font-weight:700;}

/* Science */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
@media(max-width:640px){.pgrid{grid-template-columns:1fr;}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-sm);}
.pcard h3{margin:0 0 3px;font-size:16.5px;}
.pcard .zh{font-size:12.5px;color:var(--olive);font-weight:800;}
.pcard p{font-size:13px;color:var(--ink-soft);margin:7px 0 0;}
.expcard{background:linear-gradient(160deg,#fff,#f3f7f1);border:1px solid var(--line);border-radius:var(--r-md);padding:15px;margin-bottom:11px;}
.expcard .et{display:flex;align-items:center;gap:9px;}
.expcard h3{margin:0;font-size:17px;}
.expcard .tag{font-size:11px;font-weight:800;color:var(--olive);background:#e6f1ea;padding:2px 9px;border-radius:999px;}
.expcard p{font-size:13.8px;margin:9px 0 0;color:var(--ink);}

/* Sentences */
.sent-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;}
.sent-tabs::-webkit-scrollbar{display:none;}
.sent-tabs button{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1.5px solid var(--line-2);color:var(--ink-soft);}
.sent-tabs button.on{background:var(--olive);color:#fff;border-color:var(--olive);}
.sentrow{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;margin-bottom:8px;}
.sentrow .txt{flex:1;}
.sentrow .es{font-size:14.5px;font-weight:700;}
.sentrow .zh{font-size:12.8px;color:var(--ink-soft);display:none;}
.sentrow.showzh .zh{display:block;}

/* Roots */
.net{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px;}
.node{background:#fff;border:1.5px solid var(--line-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;}
.node small{color:var(--ink-faint);font-weight:600;margin-left:5px;}
.affgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
@media(max-width:600px){.affgrid{grid-template-columns:1fr;}}
.affcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px;}
.affcard h3{margin:0 0 8px;font-size:15px;}
.affrow{font-size:13px;margin-bottom:6px;}
.affrow b{color:var(--purple);}
.aword{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px;}
.aword .w{font-weight:800;}
.aword .col{font-size:12.5px;color:var(--saffron);}
.aword .s{font-size:13.5px;margin-top:4px;}
.aword .sz{font-size:12.5px;color:var(--ink-soft);}

/* Plan timeline */
.month{display:grid;grid-template-columns:64px 1fr;gap:0;margin-bottom:0;}
.mline{position:relative;display:flex;flex-direction:column;align-items:center;}
.mdot{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;z-index:2;flex:none;}
.mbar{flex:1;width:2px;background:var(--line-2);margin-top:4px;}
.mbody{padding:0 0 18px 12px;}
.mbody .lvl{font-size:12px;font-weight:800;color:var(--olive);}
.mbody h3{margin:2px 0 6px;font-size:19px;}
.mbody .h{font-size:12px;color:var(--ink-faint);margin-bottom:8px;}
.wk{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;margin-bottom:6px;}
.mbody .sync{font-size:12.5px;color:var(--blue);margin-top:6px;}
.plan-note{background:#fff7e8;border:1px solid #f0dcb4;border-radius:var(--r-md);padding:13px 15px;font-size:13px;color:#8a6a2f;margin-bottom:16px;}

/* Habits / review */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.hcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px;box-shadow:var(--shadow-sm);}
.hcard .n{font-family:"DM Serif Display",serif;color:var(--saffron);font-size:15px;}
.hcard p{font-size:12.8px;color:var(--ink-soft);margin:5px 0 0;}
.spaced{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.spaced .sp{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;}
.tomorrow li{margin-bottom:6px;font-size:14px;}
.wrongcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px;margin-bottom:10px;}
.wrongcard .m{font-size:11px;font-weight:800;color:var(--berry);}
.wrongcard .q{font-weight:700;font-size:14px;margin:4px 0;}
.wrongcard .res{font-size:13px;}
.wrongcard .res .ok{color:var(--green-d);font-weight:700;}
.wrongcard .res .bad{color:var(--red-d);text-decoration:line-through;}
.wrongcard .w{font-size:12.5px;color:var(--ink-soft);margin-top:6px;background:var(--card-3);padding:7px 10px;border-radius:8px;}
.empty{text-align:center;color:var(--ink-faint);padding:30px 10px;font-size:14px;}
.datacard{background:linear-gradient(160deg,#3b3026,#5a4636);color:#f6efe4;border-radius:var(--r-lg);padding:20px;margin-bottom:16px;}
.datacard h3{color:#fff;margin:0 0 12px;font-size:21px;}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:13.5px;}
.dgrid b{color:#ffd08a;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.legend-note{font-size:12px;color:var(--ink-faint);margin:4px 2px 10px;}
</style>
</head>

<div class="topbar">
 <div class="topbar-in">
  <div class="brand">
   <svg class="logo" viewBox="0 0 64 64"><circle cx="32" cy="22" r="11" fill="#FFC846"/><circle cx="28" cy="21" r="1.6" fill="#3B3026"/><circle cx="36" cy="21" r="1.6" fill="#3B3026"/><path d="M29.5 24 L32 26.5 L34.5 24 Z" fill="#F2743C"/><path d="M12 33 L18 28 L24 33.5 L30 28 L36 33 L42 28 L48 33.5 L54 28 C54 47 45 58 32 58 C19 58 12 47 12 33 Z" fill="#FFFFFF" stroke="#E4CFA9" stroke-width="2" stroke-linejoin="round"/></svg>
   <div><b>Kitchen Spanish Lab</b><small>后厨西语 × 厨房科学实验室 · Daily Kitchen Spanish</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
 </div>
</div>

<div class="wrap">

 <!-- ===== HOME ===== -->
 <section class="view active" id="v-home">
  <div class="beta">🍃 此产品为 Beta 版本，后台持续优化改进，欢迎反馈！</div>
  <div class="hero">
   <div class="kicker">DAY 01 · Daily Kitchen Spanish</div>
   <h1>灶台操作 × 火候 × 烹煮</h1>
   <p>从「背句子」升级到「自己生成句子」。围绕真实后厨场景，打通：场景 → 意图 → 事件关系 → 语块 → 语法 → 听力 → 口语 → 厨房科学 → 间隔复习。西班牙本土西语优先，拉美差异单独标注。</p>
   <button class="btn primary" onclick="go('daily')">开始 DAY 01 · 100 题</button>
   <button class="btn ghost" onclick="go('listen')">先听一段</button>
  </div>
  <div class="stats" id="homeStats"></div>
  <div class="sec-title"><h2>今日板块</h2><span class="tagline">Kitchen Spanish Lab 模块导航</span></div>
  <div class="qgrid" id="homeGrid"></div>
 </section>

 <!-- ===== DAILY QUIZ ===== -->
 <section class="view" id="v-daily">
  <div class="sec-title"><h2>DAY 01 · 100 题</h2><span class="tagline" id="quizProgress"></span></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
   <button class="btn small" onclick="resetQuiz()">重置当日答题</button>
   <button class="btn small ghost" onclick="go('review')">查看错题本</button>
  </div>
  <div id="quizBody"></div>
  <div class="card" id="balanceCard" style="text-align:center;"></div>
 </section>

 <!-- ===== LISTENING ===== -->
 <section class="view" id="v-listen"><div id="listenBody"></div></section>

 <!-- ===== DIALOGUES ===== -->
 <section class="view" id="v-dialogue"><div id="dialogueBody"></div></section>

 <!-- ===== SLANG ===== -->
 <section class="view" id="v-slang"><div id="slangBody"></div></section>

 <!-- ===== SCIENCE ===== -->
 <section class="view" id="v-science"><div id="scienceBody"></div></section>

 <!-- ===== SENTENCES ===== -->
 <section class="view" id="v-sent"><div id="sentBody"></div></section>

 <!-- ===== ROOTS ===== -->
 <section class="view" id="v-roots"><div id="rootsBody"></div></section>

 <!-- ===== PLAN ===== -->
 <section class="view" id="v-plan"><div id="planBody"></div></section>

 <!-- ===== REVIEW ===== -->
 <section class="view" id="v-review"><div id="reviewBody"></div></section>

<script>
/* ============================================================
   Kitchen Spanish Lab — DATA (DAY 01)
   后厨西语 × 厨房科学实验室

/* ---------- TTS ---------- */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/es[-_]ES/i.test(v.lang+" "+(v.name||"")))||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text,rate){
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="es-ES";u.rate=rate||1;if(voice)u.voice=voice;
  u.onerror=()=>toast("当前设备暂无西语语音，可在系统中添加");speechSynthesis.speak(u);}
 catch(e){toast("当前设备不支持西语语音");}
}

  const qs=QUIZ.map((q,i)=>({q,i})).filter(x=>x.q.m===md.m);
  const done=qs.filter(x=>state.ans[x.i]!=null).length;
  html+=`<div class="modhead"><h3>${md.emo} ${md.t}</h3><span class="pill">${qs.length} 题</span><span class="pill">已完成 ${done}/${qs.length}</span></div>`;
  qs.forEach(({q,i})=>{ html+=cardHTML(q,i); });
 });
 document.getElementById("quizBody").innerHTML=html;
 const dist={0:0,1:0,2:0,3:0};QUIZ.forEach(q=>dist[q.c]++);
 document.getElementById("balanceCard").innerHTML=
  `<div class="kicker">答案分布检查</div><div style="font-size:18px;font-weight:800;margin:6px 0;">
   A：${dist[0]} &nbsp; B：${dist[1]} &nbsp; C：${dist[2]} &nbsp; D：${dist[3]}</div>
   ${dist[0]===25&&dist[1]===25&&dist[2]===25&&dist[3]===25?"✅ 平衡通过":"⚠ 分布不均"}`;
 updateQuizProgress();
}
function cardHTML(q,i){
 const answered=state.ans[i]!=null;
 let opts=q.o.map((op,j)=>{
  let cls="opt";
  if(answered){
   if(j===q.c)cls+=" correct";
   else if(j===state.ans[i])cls+=" wrong";
   else cls+=" dim";
  }
  return `<button class="${cls}" data-i="${i}" data-j="${j}"><span class="letter">${LETTERS[j]}</span><span>${op}</span></button>`;
 }).join("");
 let ex="";
 if(answered){
  const ok=state.ans[i]===q.c;
  ex=`<div class="explain show"><b>${ok?"✅ 回答正确":"❌ 正确答案 "+LETTERS[q.c]}</b> · ${q.w}</div>`;
 }
 return `<div class="qcard" data-i="${i}">
   <div class="qno">Q${String(i+1).padStart(2,"0")} · ${MODS[q.m-1].t}</div>
   <div class="qstem-row">${audioBtnFor(q,true)}<div class="qstem">${q.q}</div></div>
   <div class="opts">${opts}</div>${ex}</div>`;
}
function updateQuizProgress(){
 const n=Object.keys(state.ans).length;
 const correct=n-Object.keys(state.wrong).length;
 document.getElementById("quizProgress").textContent=`已完成 ${n}/100 · 正确 ${correct}`;
}
document.getElementById("quizBody").addEventListener("click",e=>{
 const b=e.target.closest(".opt");if(!b)return;
 const i=+b.dataset.i,j=+b.dataset.j;
 if(state.ans[i]!=null)return;
 state.ans[i]=j;markActivity();
 if(j===QUIZ[i].c)delete state.wrong[i];else state.wrong[i]=j;
 save();
 const card=document.querySelector(`.qcard[data-i="${i}"]`);
 card.outerHTML=cardHTML(QUIZ[i],i);
 updateQuizProgress();updateHomeStats();
});
function resetQuiz(){state.ans={};state.wrong={};save();renderQuiz();updateHomeStats();toast("已重置当日答题");}

/* ---------- Home ---------- */
function updateHomeStats(){

 document.getElementById("homeStats").innerHTML=[
  [n,"已练习题次"],[state.stats.streak||0,"连续天数"],[acc,"近期正确率"],[Object.keys(state.wrong).length,"错题本"]
 ].map(([num,lab])=>`<div class="stat"><div class="num">${num}</div><div class="lab">${lab}</div></div>`).join("");
}
function renderHome(){
 document.getElementById("homeGrid").innerHTML=MODS.map(md=>
  `<button class="qcell" onclick="go('daily')"><span class="emo">${md.emo}</span><b>${md.t}</b><span>${md.d}</span></button>`).join("");
 updateHomeStats();
}

/* ---------- Listening ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const NEGW=["todavía no","no hay que","no","nunca","nada","nadie","ni"];
const TIMEW=["antes de","después de","a las doce","mientras","cuando","enseguida","todavía","ahora","mañana","hoy","ya"];
const QTYW=["unos cinco","un poco","primero","tercer","cinco","cuatro","tres","dos"];
function kw(text){
 const re=/(todavía no|no hay que|antes de|después de|a las doce|mientras|cuando|enseguida|todavía|ahora|mañana|hoy|ya|unos cinco|un poco|primero|tercer|cinco|cuatro|tres|dos|no|nunca|nada|nadie|ni)/g;
 return esc(text).replace(re,m=>{
  let c=NEGW.includes(m)?"kw-neg":TIMEW.includes(m)?"kw-time":"kw-mark";
  return `<span class="${c}">${m}</span>`;});
}
function renderListen(){
 let packs=Object.keys(PASSAGES).map((k,idx)=>{
  const p=PASSAGES[k];
  return `<div class="lpack" id="lp-${k}">
    <h3>🎧 Audio ${idx+1} · ${p.t}</h3>
    <div class="lsub">A 慢速版（首次听） · B 自然语速版（接近真实后厨） · C 关键词版 · E 脚本</div>
    <div class="lbtns">
      <button class="btn small primary" onclick="speak(this.dataset.t,0.72)" data-t="${escAttr(p.es)}">🐢 慢速版</button>
      <button class="btn small" onclick="speak(this.dataset.t,1.02)" data-t="${escAttr(p.es)}">🔊 自然语速</button>
      <button class="btn small ghost" onclick="toggleKW('${k}')">🏷️ 关键词</button>
      <button class="btn small ghost" onclick="toggleScr('${k}')">📄 脚本</button>
    </div>
    <div class="lscript" id="scr-${k}"><span id="scrtxt-${k}">${p.es}</span><span class="zh">${p.zh}</span></div>
  </div>`;}).join("");
 let scripts=Object.keys(PASSAGES).map((k,idx)=>`<p><b>Audio ${idx+1} · ${PASSAGES[k].t}</b><br>${PASSAGES[k].es}<br><span style="color:var(--ink-soft)">${PASSAGES[k].zh}</span></p>`).join("");
 document.getElementById("listenBody").innerHTML=`
  <div class="sec-title"><h2>🎧 Listening Pack</h2><span class="tagline">今日听力包</span></div>
  <div class="card"><div class="kicker">关键词图例</div>
   <p style="font-size:13px;margin:8px 0 0;">
   <span class="kw-time">时间/连词</span> · <span class="kw-neg">否定</span> · <span class="kw-mark">数量/顺序</span>　信息抓取重点：人物 + 动作 + 时间 + 数量 + 状态 + 否定。</p></div>
  ${packs}
  <div class="card"><p style="font-size:13.5px;margin:0;">D 听力问题（10 题）已并入「每日100题」的 <b>模块 7 听力理解</b>。</p>
   <button class="btn small primary" style="margin-top:10px;" onclick="go('daily')">去做听力 10 题</button></div>
  <div class="sec-title"><h2>🎧 今日音频脚本</h2><span class="tagline">所有听力文本统一汇总（对话脚本见「场景对话」）</span></div>
  <div class="card">${scripts}</div>`;
}
function toggleScr(k){document.getElementById("scr-"+k).classList.toggle("show");}
function toggleKW(k){
 const el=document.getElementById("scrtxt-"+k);const p=PASSAGES[k];
 el.dataset.kw=el.dataset.kw==="1"?"0":"1";
 el.innerHTML=el.dataset.kw==="1"?kw(p.es):esc(p.es);
}

/* ---------- Review / data card ---------- */
function dashPos(){const c={};DAYVOCAB.forEach(([w,p])=>c[p]=(c[p]||0)+1);return c;}
function renderReview(){
 const n=Object.keys(state.ans).length,correct=n-Object.keys(state.wrong).length;
 const pos=dashPos();let nw=0;DAYVOCAB.forEach(([w,p,k])=>{if(k)nw++;});
 const mastery=n?correct+"/"+n:"尚未开始";
 const wrongKeys=Object.keys(state.wrong);
 let wrongHTML;
 if(!wrongKeys.length)wrongHTML=`<div class="empty">错题本是空的，去做几道题吧。</div>`;
 else wrongHTML=wrongKeys.map(i=>{i=+i;const q=QUIZ[i];
   return `<div class="wrongcard">
     <div class="m">${MODS[q.m-1].t} · Q${i+1}</div>
     <div class="q">${q.q}</div>
     <div class="res"><span class="bad">你选：${LETTERS[state.wrong[i]]}. ${q.o[state.wrong[i]]}</span><br>
       <span class="ok">正确：${LETTERS[q.c]}. ${q.o[q.c]}</span></div>
     <div class="w">${q.w}</div>
     <button class="btn small" style="margin-top:9px;" onclick="masterWrong(${i})">已掌握，移除</button></div>`;}).join("");
 document.getElementById("reviewBody").innerHTML=`
  <div class="datacard">
   <h3>DAY 01 学习数据</h3>
   <div class="dgrid">
    <div>新词：<b>${nw}</b></div><div>复习词：<b>${DAYVOCAB.length-nw}</b></div>
    <div>新语块：<b>${pos.chunk||0}</b></div><div>词根：<b>1</b>（前缀 ${ROOTS.prefix.length} · 后缀 ${ROOTS.suffix.length}）</div>
    <div>语法：<b>命令式 + cuando + subjuntivo</b></div><div>厨房科学：<b>加热 / 沸腾 / 静置</b></div>
    <div>俚语：<b>10</b>（库 25）</div><div>听力：<b>10 题</b> · 对话 <b>6 组</b></div>
    <div>总题数：<b>100</b></div><div>错题：<b>${wrongKeys.length}</b></div>
    <div>掌握度：<b>${mastery}</b></div><div>连续天数：<b>${state.stats.streak||0}</b></div>
   </div>
  </div>
  <div class="sec-title"><h2>🧠 今日学习行为</h2></div>
  <div class="hgrid">${HABITS.map((h,i)=>`<div class="hcard"><div class="n">Step ${i+1} · ${h.s}</div><p>${h.d}</p></div>`).join("")}</div>
  <div class="sec-title"><h2>🔁 间隔复习</h2></div>
  <div class="card"><div class="spaced">${SPACED.map(s=>`<span class="sp">${s.d} · ${s.x}</span>`).join("")}</div></div>
  <div class="sec-title"><h2>📌 明日优先复习</h2></div>
  <div class="card tomorrow"><ol style="margin:0;padding-left:20px;">${TOMORROW.map(t=>`<li>${t}</li>`).join("")}</ol></div>
  <div class="sec-title"><h2>📕 错题本</h2><span class="tagline">${wrongKeys.length} 题待巩固</span></div>
  ${wrongHTML}`;
}
function masterWrong(i){delete state.wrong[i];save();renderReview();updateHomeStats();toast("已移出错题本");}

buildNav();renderHome();renderQuiz();renderListen();renderDialogues();renderSlang();renderScience();renderSent();renderRoots();renderPlan();renderReview();
