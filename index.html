<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐣 阿蛋的后厨西语 🍳</title>
<style>
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --surface2:#FBF9F4; --ink:#23272F; --soft:#6B7280;
  --line:#E8E3D8; --brand:#C2703D; --brand-d:#9C5528;
  --pattern-bg:#E3EDFD; --pattern-fg:#1D4ED8;
  --question-bg:#EFE7FD; --question-fg:#6D28D9;
  --prep-bg:#FDEBD9; --prep-fg:#C2410C;
  --conj-bg:#D9F0F4; --conj-fg:#0E7490;
  --verb-bg:#DCF0E1; --verb-fg:#15803D;
  --tense-bg:#FBDFEB; --tense-fg:#BE185D;
  --pron-bg:#F9EFD6; --pron-fg:#92610A;
  --ok:#15803D; --ok-bg:#E4F4E8; --err:#B91C1C; --err-bg:#FBEAEA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.view{min-height:100vh;display:flex;flex-direction:column}

/* ===== 登录 ===== */
#login{justify-content:center;align-items:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(120,90,50,.08)}
.login-logo{font-size:42px;text-align:center;line-height:1.2}
.login-title{font-size:21px;font-weight:800;text-align:center;margin:14px 0 4px}
.login-sub{text-align:center;color:var(--soft);font-size:13px;margin-bottom:26px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--soft)}
.field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;background:var(--surface2)}
.field input:focus{outline:none;border-color:var(--brand)}
.btn-primary{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;margin-top:18px;transition:background .2s}
.btn-primary:hover{background:var(--brand-d)}
.login-err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.login-notice{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:11px;color:var(--soft);line-height:1.7;text-align:center}

/* ===== 顶部导航 ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar .back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink)}
.topbar .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub-ttl{font-size:12px;color:var(--soft)}

.container{max-width:860px;width:100%;margin:0 auto;padding:24px 20px 70px;flex:1}

/* ===== 主页模块 ===== */
.page-head{margin-bottom:22px}
.page-head h1{font-size:23px;font-weight:800}
.page-head p{color:var(--soft);font-size:13px;margin-top:6px}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(120,90,50,.05)}
.mod-card .mhead{display:flex;align-items:center;gap:14px}
.mod-ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.mod-card .mname{font-size:17px;font-weight:700}
.mod-card .mstats{font-size:12px;color:var(--soft);margin-top:3px}
.mod-card .mstats .cefr{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:6px}
.sub-list{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.sub-item{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px 13px;text-align:left;transition:border-color .15s}
.sub-item:hover{border-color:var(--brand)}
.sub-item .sn{font-size:13px;font-weight:600;line-height:1.4}
.sub-item .sm{font-size:11px;color:var(--soft);margin-top:4px}
.mode-switch{display:flex;gap:8px;margin:16px 0 4px}
.mode-pill{flex:1;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--soft)}
.mode-pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.start-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;margin-top:12px}

/* ===== 学习页 ===== */
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress-bar{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--brand);border-radius:5px;transition:width .3s}
.progress-txt{font-size:12px;color:var(--soft);white-space:nowrap}
.reading-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.reading-box .rtitle{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.reading-box .rtitle::before{content:"";width:4px;height:15px;background:var(--brand);border-radius:2px}
.reading-box .es{font-size:15.5px;line-height:2.2}
.reading-box .zh{color:var(--soft);font-size:13px;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.q-type{font-size:11px;font-weight:700;color:var(--brand);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;display:inline-block;margin-bottom:12px}
.q-sentence{font-size:17px;line-height:2.2;margin-bottom:6px}
.q-zh{font-size:13px;color:var(--soft);margin-bottom:16px}
.q-prompt{font-size:15px;font-weight:600;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;padding:13px 15px;text-align:left;font-size:14.5px;transition:all .15s;display:flex;align-items:center;gap:10px}
.opt:hover:not(.locked){border-color:var(--brand)}
.opt .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:transparent}
.opt.selected{border-color:var(--brand);background:#FDF3EB}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .mk{background:var(--err);border-color:var(--err);color:#fff}
.opt.locked{cursor:default}
.feedback{margin-top:15px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err)}
.analysis{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;display:none}
.analysis.show{display:block}
.analysis .at{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.aseg{margin-bottom:11px;font-size:13.5px;line-height:1.7}
.aseg .lab{display:inline-block;font-weight:700;color:var(--brand);min-width:64px}
.q-nav{display:flex;gap:10px;margin-top:20px}
.q-nav button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:14px;font-weight:600}
.q-nav button:disabled{opacity:.4;cursor:not-allowed}
.q-nav .next{background:var(--brand);color:#fff;border-color:var(--brand)}
.q-nav .next:disabled{background:var(--line);border-color:var(--line);color:var(--soft)}

/* 色块高亮 */
.hl{border-radius:5px;padding:1px 5px;white-space:normal}
.hl-pattern{background:var(--pattern-bg);color:var(--pattern-fg);border-left:3px solid var(--pattern-fg);padding-left:4px}
.hl-question{background:var(--question-bg);color:var(--question-fg);font-weight:600}
.hl-prep{background:var(--prep-bg);color:var(--prep-fg);box-shadow:inset 0 0 0 1px var(--prep-fg);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-conj{background:var(--conj-bg);color:var(--conj-fg);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.hl-verb{background:var(--verb-bg);color:var(--verb-fg);font-weight:700}
.hl-tense{background:var(--tense-bg);color:var(--tense-fg);font-style:italic}
.hl-pron{background:var(--pron-bg);color:var(--pron-fg)}
.hl-click{cursor:pointer}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,25,18,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:var(--surface);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal{max-height:86vh;overflow-y:auto}
.modal .mword{font-size:21px;font-weight:800;margin-bottom:4px}
.modal .mpos{font-size:12px;color:var(--soft);margin-bottom:12px}
.msec{margin-bottom:11px}
.msec-lab{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:3px;letter-spacing:.3px}
.msec-body{font-size:14.5px;line-height:1.7}
.msec-sub{font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.6}
.msec-note{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--soft);line-height:1.6}
.mdetail-btn{margin-top:12px;width:100%;background:var(--pattern-bg);color:var(--pattern-fg);border:1px solid var(--pattern-fg);border-radius:10px;padding:10px;font-size:13px;font-weight:700}
.mdetail-btn:hover{background:#D6E5FC}
.modal .mclose{margin-top:10px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600}

/* 记住密码 */
.remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--soft);cursor:pointer}
.remember input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}

/* 学习页等级筛选 */
.level-filter{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.level-filter .lf-lab{font-size:12px;font-weight:700;color:var(--soft);margin-right:2px}
.lf-pill{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--soft)}
.lf-pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 生词本 */
.vocab-search{margin-bottom:14px}
.vocab-search input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:15px;font-family:inherit;background:var(--surface);box-shadow:0 3px 12px rgba(120,90,50,.05)}
.vocab-search input:focus{outline:none;border-color:var(--brand)}
.vocab-filter{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.vf-pill{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--soft)}
.vf-pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.vocab-count{font-size:12px;color:var(--soft);margin-bottom:12px}
.vocab-list{display:flex;flex-direction:column;gap:10px}
.vocab-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-align:left;transition:border-color .15s}
.vocab-item:hover{border-color:var(--brand)}
.vocab-item .vi-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vocab-item .vi-word{font-size:16px;font-weight:800}
.vocab-item .vi-pos{font-size:11px;color:var(--soft)}
.vocab-item .vi-cefr{font-size:10.5px;font-weight:700;background:var(--pattern-bg);color:var(--pattern-fg);border-radius:6px;padding:1px 7px;margin-left:auto}
.vocab-item .vi-mean{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.55}
.vocab-empty{text-align:center;color:var(--soft);font-size:14px;padding:40px 0}

/* 详情页 */
.detail-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 22px rgba(120,90,50,.06)}
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.detail-word{font-size:25px;font-weight:800}
.detail-pos{font-size:12px;color:var(--soft)}
.detail-cefr{font-size:11px;font-weight:700;background:var(--pattern-bg);color:var(--pattern-fg);border-radius:7px;padding:2px 10px;margin-left:auto}
.detail-sec{margin-top:18px;border-top:1px dashed var(--line);padding-top:15px}
.detail-sec:first-of-type{border-top:none;padding-top:8px}
.detail-lab{font-size:12px;font-weight:800;color:var(--brand);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.detail-body{font-size:14.5px;line-height:1.75}
.detail-ex-es{font-size:15px;font-weight:600;line-height:1.7}
.detail-ex-zh{font-size:13px;color:var(--soft);margin-top:3px}
.detail-syn{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.detail-syn .ds-lab{font-size:12px;font-weight:700;min-width:52px;color:var(--soft)}
.detail-chip{font-size:12px;background:var(--ok-bg);color:var(--ok);border-radius:7px;padding:2px 10px}
.detail-chip.ant{background:var(--err-bg);color:var(--err)}
.detail-note{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--soft);line-height:1.7}

/* 图例 */
.legend-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.legend-chip{font-size:11px;border-radius:6px;padding:2px 8px;display:flex;align-items:center;gap:4px}
@media(max-width:600px){.sub-list{grid-template-columns:1fr}.container{padding:18px 14px 60px}.q-card{padding:18px}.login-card{padding:32px 22px}}
</style>
</head>
<body>

<!-- ===== 登录视图 ===== -->
<div class="view" id="login">
  <div class="login-card">
    <div class="login-logo">🐣 🍳</div>
    <div class="login-title">阿蛋的后厨西语</div>
    <div class="login-sub">厨房西语 × 餐厅口语 × 科学科普 · V10</div>
    <div class="field">
      <label for="pwd">访问密码</label>
      <input type="password" id="pwd" placeholder="请输入访问密码" autocomplete="off">
    </div>
    <label class="remember" id="rememberWrap">
      <input type="checkbox" id="rememberPwd">
      <span>记住密码，下次免登录</span>
    </label>
    <button class="btn-primary" id="loginBtn">登 录</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-notice">本学习资料仅供个人学习使用，未经作者书面许可，请勿转载、复制、改写、公开传播或用于任何形式的二次售卖。</div>
  </div>
</div>

<!-- ===== 主页视图 ===== -->
<div class="view hidden" id="home">
  <div class="topbar">
    <div class="ttl">🐣 阿蛋的后厨西语 🍳</div>
    <button class="back" id="vocabEntry">📖 生词本</button>
    <button class="back" id="logoutBtn">退出</button>
  </div>
  <div class="container">
    <div class="page-head">
      <h1>选择学习模块</h1>
      <p>共 242 题 · 阅读 / 答题双模式 · 点击色块可查词，生词本可深度检索</p>
    </div>
    <div id="moduleList"></div>
  </div>
</div>

<!-- ===== 学习视图 ===== -->
<div class="view hidden" id="study">
  <div class="topbar">
    <button class="back" id="studyBack">← 返回</button>
    <div>
      <div class="ttl" id="studyTitle"></div>
      <div class="sub-ttl" id="studySub"></div>
    </div>
  </div>
  <div class="container">
    <div class="mode-switch">
      <button class="mode-pill active" id="modeRead">📖 阅读模式</button>
      <button class="mode-pill" id="modeQuiz">✏️ 答题模式</button>
    </div>
    <div class="level-filter" id="levelFilter">
      <span class="lf-lab">等级</span>
      <button class="lf-pill active" data-level="ALL">全部</button>
      <button class="lf-pill" data-level="A1">A1</button>
      <button class="lf-pill" data-level="A2">A2</button>
      <button class="lf-pill" data-level="B1">B1</button>
      <button class="lf-pill" data-level="B2">B2</button>
      <button class="lf-pill" data-level="C1">C1</button>
      <button class="lf-pill" data-level="C2">C2</button>
    </div>
    <div class="legend-bar" id="legendBar"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-txt" id="progTxt"></div>
    </div>
    <div id="studyArea"></div>
    <div class="q-nav">
      <button id="prevBtn">← 上一题</button>
      <button class="next" id="nextBtn">下一题 →</button>
    </div>
  </div>
</div>

<!-- ===== 生词本视图 ===== -->
<div class="view hidden" id="vocab">
  <div class="topbar">
    <button class="back" id="vocabBack">← 返回</button>
    <div class="ttl">📖 生词本 · 词汇搜索</div>
  </div>
  <div class="container">
    <div class="vocab-search">
      <input type="search" id="vocabSearchInput" placeholder="🔍 输入西语词，如 salsa / cocinar / gluten…">
    </div>
    <div class="vocab-filter" id="vocabFilter">
      <button class="vf-pill active" data-level="ALL">全部</button>
      <button class="vf-pill" data-level="A1">A1</button>
      <button class="vf-pill" data-level="A2">A2</button>
      <button class="vf-pill" data-level="B1">B1</button>
      <button class="vf-pill" data-level="B2">B2</button>
      <button class="vf-pill" data-level="C1">C1</button>
      <button class="vf-pill" data-level="C2">C2</button>
    </div>
    <div class="vocab-count" id="vocabCount"></div>
    <div class="vocab-list" id="vocabList"></div>
  </div>
</div>

<!-- ===== 生词详情视图 ===== -->
<div class="view hidden" id="vocabDetail">
  <div class="topbar">
    <button class="back" id="detailBack">← 返回生词本</button>
    <div class="ttl">词条详情</div>
  </div>
  <div class="container">
    <div class="detail-card" id="detailCard"></div>
  </div>
</div>

<!-- ===== 词汇弹窗 ===== -->
<div class="modal-mask hidden" id="wordModal">
  <div class="modal">
    <div class="mword" id="mWord"></div>
    <div class="mpos" id="mPos"></div>
    <div class="msec">
      <div class="msec-lab">通用释义</div>
      <div class="msec-body" id="mGeneral"></div>
    </div>
    <div class="msec">
      <div class="msec-lab">后厨专业释义</div>
      <div class="msec-body" id="mProf"></div>
    </div>
    <div class="msec">
      <div class="msec-lab">专属例句</div>
      <div class="msec-body" id="mExampleEs"></div>
      <div class="msec-sub" id="mExampleZh"></div>
    </div>
    <div class="msec">
      <div class="msec-lab">轻量化 note</div>
      <div class="msec-note" id="mNote"></div>
    </div>
    <button class="mdetail-btn" id="mToDetail">📖 打开生词本，查看词根/多义/同义/造句详解</button>
    <button class="mclose" id="mClose">关 闭</button>
  </div>
</div>

<script>
// 题库数据（自动生成，请勿手工编辑）
const QB_DATA = {
 "modules": [
  {
   "moduleId": "M1",
   "moduleName": "餐厅西语万能开口表",
   "short": "餐厅口语",
   "icon": "cafe",
   "color": "blue",
   "cefrRange": "A1-A2",
   "subModules": [
    {
     "subModuleId": "M1-01",
     "name": "万能开头句型",
     "questions": 20,
     "level": "P0",
     "cefr": "A1"
    },
    {
     "subModuleId": "M1-02",
     "name": "进店、找座位、预约",
     "questions": 18,
     "level": "P0",
     "cefr": "A1-A2"

/* 词汇库索引：按 normalized word 建表，精准匹配 */
const normWord = w => String(w).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,;:]/g,"").trim();
const KW_MAP = new Map();
KEYWORD_LIB.forEach(x=>{ KW_MAP.set(normWord(x.word), x); });
function findKeyword(word){
  if(!word) return null;
  const k = normWord(word);
  if(KW_MAP.has(k)) return KW_MAP.get(k);
  // 兜底：去掉空格/斜杠分隔的对比标签，取第一段
  const first = k.split(/[\/]/)[0].trim();
  if(KW_MAP.has(first)) return KW_MAP.get(first);
  return null;
}
/* 隐私模式检测：localStorage 不可写则降级 */

/* ===== CEFR 等级解析（题目继承子模块等级范围） ===== */
const LEVEL_ORDER = {A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
const SUB_CEFR_MAP = {};
(function buildSubCefr(){
  QB_DATA.modules.forEach(m=>m.subModules.forEach(s=>{
    const range = (s.cefr||"").split("-").filter(Boolean);
    const lo = range[0]||"A1", hi = range[range.length-1]||lo;
    SUB_CEFR_MAP[s.subModuleId] = {lo, hi};
  }));
})();
/* 题目所属子模块的等级范围 */
function questionCefrRange(q){
  return SUB_CEFR_MAP[q._sub] || {lo:"A1",hi:"A1"};
}
/* 题目是否落在某等级 */
function questionMatchesLevel(q, level){
  if(level==="ALL") return true;
  const r = questionCefrRange(q);
  const t = LEVEL_ORDER[level];
  return t>=LEVEL_ORDER[r.lo] && t<=LEVEL_ORDER[r.hi];
}

/* ===== 渲染主页模块 ===== */
function renderModules(){
  const box = $("moduleList"); box.innerHTML="";
  QB_DATA.modules.forEach(m=>{
    const card = document.createElement("div");
    card.className="mod-card";
    const bg = m.color==="blue"?"#E3EDFD":(m.color==="purple"?"#EFE7FD":"#DCF0E1");
    const ic = m.icon==="cafe"?"☕":(m.icon==="puzzle"?"🧩":"🍳");
    let subs = m.subModules.map(s=>`
      <button class="sub-item" data-sub="${s.subModuleId}">
        <div class="sn">${s.name}</div>
        <div class="sm">${s.questions} 题 · ${s.level}</div>
      </button>`).join("");
    card.innerHTML = `
      <div class="mhead">
        <div class="mod-ico" style="background:${bg}">${ic}</div>
        <div>
          <div class="mname">${m.moduleName}</div>
          <div class="mstats">${m.questions.length} 题 · ${m.subModules.length} 个子模块<span class="cefr">${m.cefrRange}</span></div>
        </div>
      </div>
      <div class="sub-list">${subs}</div>
      <button class="start-btn" data-sub="ALL">开始全部 ${m.questions.length} 题 →</button>`;

      el.onclick = ()=> startStudy(m, el.dataset.sub);
    });
    box.appendChild(card);

}

/* ===== 开始学习 ===== */
function startStudy(m, subId){
  state.module = m; state.sub = subId; state.index = 0; state.answered = new Set();
  state.studyLevel = "ALL";
  document.querySelectorAll("#levelFilter .lf-pill").forEach(b=>b.classList.toggle("active",b.dataset.level==="ALL"));
  state.questions = applyStudyFilter(m, subId, "ALL");
  const subName = subId==="ALL" ? "全部子模块" : m.subModules.find(s=>s.subModuleId===subId).name;
  $("studyTitle").textContent = m.moduleName;
  $("studySub").textContent = subName;
  show("study");
  setMode("read");
  renderLegend();
  renderQuestion();
}
/* 组合子模块 + 等级过滤 */
function applyStudyFilter(m, subId, level){
  let base = subId==="ALL" ? m.questions : m.questions.filter(q=>q._sub===subId);
  if(level && level!=="ALL") base = base.filter(q=>questionMatchesLevel(q,level));
  return base;
}
/* 等级筛选按钮 */
document.querySelectorAll("#levelFilter .lf-pill").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("#levelFilter .lf-pill").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const level = btn.dataset.level;
    state.studyLevel = level;
    const cur = state.questions[state.index];
    state.questions = applyStudyFilter(state.module, state.sub, level);
    state.index = 0;
    if(!state.questions.length){
      $("studyArea").innerHTML = `<div class="vocab-empty">该范围下没有题目，请更换等级或子模块。</div>`;
      $("progFill").style.width="0";
      $("progTxt").textContent="0 / 0";
      return;
    }
    renderQuestion();
  };
});
$("studyBack").onclick = ()=> show("home");
$("modeRead").onclick = ()=> setMode("read");
$("modeQuiz").onclick = ()=> setMode("quiz");
function setMode(m){
  state.mode = m;
  $("modeRead").classList.toggle("active", m==="read");
  $("modeQuiz").classList.toggle("active", m==="quiz");
  renderQuestion();
}
function renderLegend(){
  $("legendBar").innerHTML = Object.keys(CAT_NAME).map(c=>
    `<span class="legend-chip hl hl-${c}">${CAT_NAME[c]}</span>`).join("");
}

/* ===== 高亮处理：根据 keyWords 包裹 es_text =====
   仅高亮真正成词、且能在词汇库中匹配到的词；色块 data-word 与库 word 对应 */
function highlight(es, keyWords){
  if(!keyWords) return escapeHtml(es);
  const catMap = new Map();
  keyWords.forEach(k=>{
    const w = k.word;
    if(!w) return;
    // 排除语法元标签（含 + → 斜杠、省略号或中文字符）
    if(/[+→]/.test(w) || /\//.test(w) || /\.\.\./.test(w) || /[\u4e00-\u9fff]/.test(w)) return;
    if(catMap.has(w)) return;
    // 必须能在词汇库匹配，才渲染为可点击色块
    if(!findKeyword(w)) return;
    catMap.set(w, k.category);
  });
  const terms = [...catMap.keys()].sort((a,b)=>b.length-a.length);
  if(!terms.length) return escapeHtml(es);
  const alt = terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
  const re = new RegExp("(?<![A-Za-zÀ-ÿ])("+alt+")(?![A-Za-zÀ-ÿ])","g");
  return escapeHtml(es).replace(re, (m,w)=>
    `<span class="hl hl-${catMap.get(w)} hl-click" data-word="${w.replace(/"/g,"&quot;")}">${w}</span>`);
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ===== 渲染当前题 ===== */
function renderQuestion(){
  const q = state.questions[state.index];
  const n = state.questions.length;
  $("progFill").style.width = ((state.index+1)/n*100)+"%";
  $("progTxt").textContent = `${state.index+1} / ${n}`;
  $("prevBtn").disabled = state.index===0;
  $("nextBtn").disabled = state.index===n-1;
  $("nextBtn").textContent = state.index===n-1 ? "已到最后" : "下一题 →";

  let html = "";
  // 阅读篇：显示阅读文本（仅第一题或每次都显示）
  if(q._reading){
    html += `<div class="reading-box">
      <div class="rtitle">${q._reading.title}</div>
      <div class="es">${highlight(q._reading.es, q.keyWords)}</div>
      <div class="zh">${q._reading.zh}</div>
    </div>`;
  }
  if(state.mode==="read"){
    html += renderRead(q);
  }else{
    html += renderQuiz(q);
  }
  $("studyArea").innerHTML = html;
  bindWordClicks();
  if(state.mode==="quiz") bindQuiz(q);
}

/* 阅读模式 */
function renderRead(q){
  return `<div class="q-card">
    <span class="q-type">${q._subName||""}</span>
    <div class="q-sentence">${highlight(q.es_text,q.keyWords)}</div>
    <div class="q-zh">${q.zh_meaning}</div>
    <div class="analysis show">
      <div class="at">📝 解析</div>
      ${analysisHtml(q)}
    </div>
  </div>`;
}

/* 答题模式 */
function renderQuiz(q){
  const typeName = {single:"单选题",matching:"匹配题","fill-in-blank":"填空题","reading-comprehension":"理解题"};
  return `<div class="q-card">
    <span class="q-type">${q._subName||""}</span>
    <div class="q-prompt">${q.question}</div>
    <div class="options" id="optBox">
      ${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="mk">${i+1}</span><span>${highlight(o,q.keyWords)}</span></button>`).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="analysis" id="analysis">
      <div class="at">📝 答案解析</div>
      ${analysisHtml(q)}
    </div>
  </div>`;
}
function analysisHtml(q){
  const a = q.analysis;
  return `<div class="aseg"><span class="lab">词义</span>${a["词义"]}</div>
    <div class="aseg"><span class="lab">语法搭配</span>${a["语法搭配"]}</div>
    <div class="aseg"><span class="lab">避坑</span>${a["避坑"]}</div>`;
}

/* 绑定答题 */
function bindQuiz(q){
  const box = $("optBox");
  const opts = box.querySelectorAll(".opt");
  const already = state.answered.has(q.questionId);
  if(already){
    reveal(q, opts);
  }
  opts.forEach(el=>{
    el.onclick = ()=>{
      if(state.answered.has(q.questionId)) return;
      const val = q.options[+el.dataset.i];
      state.answered.add(q.questionId);
      const ok = val===q.correctAnswer;
      const fb = $("feedback");
      fb.className = "feedback show "+(ok?"ok":"bad");
      fb.textContent = ok ? "✅ 回答正确！" : "❌ 回答错误，正确答案："+q.correctAnswer;
      reveal(q, opts, el);
    };
  });
}
function reveal(q, opts, chosen){
  opts.forEach(el=>{
    el.classList.add("locked");
    const val = q.options[+el.dataset.i];
    if(val===q.correctAnswer) el.classList.add("correct");
    else if(chosen && el===chosen) el.classList.add("wrong");
  });
  $("analysis").classList.add("show");
}

/* 词汇点击 */
function bindWordClicks(){
  document.querySelectorAll(".hl-click").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const word = el.dataset.word || el.textContent.trim();
      openWordModal(word, el);
    };
  });
}
function openWordModal(word, el){
  const entry = findKeyword(word);
  state.detailWord = word;
  if(!entry){
    // 词汇库未收录：轻提示，不编造释义
    $("mWord").textContent = word;
    $("mPos").textContent = "";
    $("mGeneral").textContent = "（该词为本题语法/对比标签，详见题目解析）";
    $("mProf").textContent = "—";
    $("mExampleEs").textContent = "—";
    $("mExampleZh").textContent = "";
    $("mNote").textContent = "可在题目解析中查看完整讲解。";
    $("mToDetail").classList.add("hidden");
    $("wordModal").classList.remove("hidden");
    return;
  }
  $("mWord").textContent = entry.word;
  $("mPos").textContent = entry.pos || "";
  $("mGeneral").textContent = entry.generalMeaning || "—";
  $("mProf").textContent = entry.profMeaning || "—";
  $("mExampleEs").textContent = entry.exampleEs || "—";
  $("mExampleZh").textContent = entry.exampleZh || "";
  $("mNote").textContent = entry.note || "—";
  $("mToDetail").classList.remove("hidden");
  $("wordModal").classList.remove("hidden");
}
/* 弹窗 → 生词本详情 */
$("mToDetail").onclick = ()=>{
  $("wordModal").classList.add("hidden");
  const entry = findKeyword(state.detailWord);
  openDetail(entry ? entry.word : state.detailWord);
};
$("mClose").onclick = ()=> $("wordModal").classList.add("hidden");
$("wordModal").onclick = e=>{ if(e.target.id==="wordModal") $("wordModal").classList.add("hidden"); };

/* ===== 生词本：导航入口 ===== */
$("vocabEntry").onclick = ()=>{
  show("vocab");
  renderVocab();
  setTimeout(()=>$("vocabSearchInput").focus(),50);
};
$("vocabBack").onclick = ()=> show("home");
$("detailBack").onclick = ()=>{ show("vocab"); renderVocab(); };

/* 等级筛选 */
document.querySelectorAll("#vocabFilter .vf-pill").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("#vocabFilter .vf-pill").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.vocabLevel = btn.dataset.level;
    renderVocab();
  };
});
/* 搜索实时过滤 */
$("vocabSearchInput").addEventListener("input", ()=> renderVocab());

function renderVocab(){
  const q = normWord($("vocabSearchInput").value);
  const lvl = state.vocabLevel;
  const list = KEYWORD_LIB.filter(x=>{
    if(lvl!=="ALL" && x.cefrLevel!==lvl) return false;
    if(!q) return true;
    // 检索范围：原文、通用释义、专业释义
    return normWord(x.word).includes(q) ||
           normWord(x.generalMeaning).includes(q) ||
           normWord(x.profMeaning).includes(q);
  }).sort((a,b)=>{
    const order={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
    const da=order[a.cefrLevel]||9, db=order[b.cefrLevel]||9;
    if(da!==db) return da-db;
    return normWord(a.word).localeCompare(normWord(b.word));
  });
  $("vocabCount").textContent = `共 ${list.length} 个词条` + (lvl!=="ALL"?` · 等级 ${lvl}`:"") + (q?` · 检索“${$("vocabSearchInput").value.trim()}”`:"");
  const box = $("vocabList");
  if(!list.length){
    box.innerHTML = `<div class="vocab-empty">未找到匹配词条，换个词或清除筛选试试。</div>`;
    return;
  }
  box.innerHTML = list.map(x=>`
    <button class="vocab-item" data-word="${(x.word||"").replace(/"/g,"&quot;")}">
      <div class="vi-top">
        <span class="vi-word">${x.word}</span>
        <span class="vi-pos">${x.pos||""}</span>
        <span class="vi-cefr">${x.cefrLevel||"—"}</span>
      </div>
      <div class="vi-mean">${x.generalMeaning||""}</div>
    </button>`).join("");
  box.querySelectorAll(".vocab-item").forEach(el=>{
    el.onclick = ()=> openDetail(el.dataset.word);
  });
}

/* ===== 生词详情页：完整渲染深度解析 ===== */
function openDetail(word){
  const entry = findKeyword(word);
  if(!entry){
    $("detailCard").innerHTML = `<div class="detail-body">未找到该词条。</div>`;
    show("vocabDetail");
    return;
  }
  const sa = entry.synAnt && typeof entry.synAnt==="object" ? entry.synAnt : {syn:[],ant:[]};
  const chips = (arr,cls)=> (arr&&arr.length)
    ? arr.map(w=>`<span class="detail-chip ${cls}">${w}</span>`).join("")
    : `<span class="detail-chip ${cls}" style="background:var(--surface2);color:var(--soft)">—</span>`;
  $("detailCard").innerHTML = `
    <div class="detail-head">
      <span class="detail-word">${entry.word}</span>
      <span class="detail-pos">${entry.pos||""}</span>
      <span class="detail-cefr">${entry.cefrLevel||"—"}</span>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">通用释义</div>
      <div class="detail-body">${entry.generalMeaning||"—"}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">后厨专业释义</div>
      <div class="detail-body">${entry.profMeaning||"—"}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">专属例句</div>
      <div class="detail-ex-es">${entry.exampleEs||"—"}</div>
      <div class="detail-ex-zh">${entry.exampleZh||""}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">同词多义辨析</div>
      <div class="detail-body">${entry.polysemyNotes||"—"}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">异词同义 / 反义对照</div>
      <div class="detail-syn"><span class="ds-lab">近义</span>${chips(sa.syn,"")}</div>
      <div class="detail-syn"><span class="ds-lab">反义</span>${chips(sa.ant,"ant")}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">词根词缀拆解</div>
      <div class="detail-body">${entry.rootAffix||"—"}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">造句思维</div>
      <div class="detail-body">${entry.sentenceTips||"—"}</div>
    </div>
    <div class="detail-sec">
      <div class="detail-lab">轻量化 note（地区变体等）</div>
      <div class="detail-note">${entry.note||"—"}</div>
    </div>`;
  show("vocabDetail");
  window.scrollTo(0,0);
}

/* 上一题/下一题 */
$("prevBtn").onclick = ()=>{ if(state.index>0){ state.index--; renderQuestion(); window.scrollTo(0,0); } };
$("nextBtn").onclick = ()=>{ if(state.index<state.questions.length-1){ state.index++; renderQuestion(); window.scrollTo(0,0); } };
